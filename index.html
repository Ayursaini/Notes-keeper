<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="author" content="Ayur Saini">
<title>Notes Keeper V2 — Dynamic Notes Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b18;
  --bg2:#11152b;
  --card:#171c38;
  --card2:#20274a;
  --text:#f8fafc;
  --muted:#a5aec7;
  --border:rgba(255,255,255,.12);
  --accent:#ff4ecd;
  --accent2:#7c5cff;
  --danger:#ff667d;
  --shadow:0 20px 55px rgba(0,0,0,.35);
}

*{transition:background .25s,color .25s,border-color .25s,box-shadow .25s,transform .25s}

body{
  min-height:100vh;
  font-family:Segoe UI,Tahoma,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(255,78,205,.18),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(124,92,255,.2),transparent 30%),
    linear-gradient(135deg,var(--bg),var(--bg2));
}

button,input,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:100;
  min-height:70px;
  padding:11px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:rgba(8,11,24,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.4rem;
  font-weight:800;
  cursor:pointer;
}

.logoIcon{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  box-shadow:0 8px 25px rgba(255,78,205,.25);
}

.actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.ddg{
  width:205px;
  height:38px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--card);
}

.ddg input{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:0 10px;
  font-size:.84rem;
}

.ddg button{
  width:38px;
  height:100%;
  border:0;
  background:transparent;
  color:var(--accent);
  font-size:1.1rem;
}

.ddg button:hover{
  background:rgba(255,78,205,.12);
}

.addBtn,.primary{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 25px rgba(124,92,255,.22);
}

.addBtn:hover,.primary:hover{
  transform:translateY(-2px);
}

.hero{
  text-align:center;
  padding:52px 18px 30px;
}

.hero h1{
  font-size:clamp(2rem,5vw,3.3rem);
  margin-bottom:10px;
}

.hero h1 span{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:var(--muted);
  line-height:1.6;
}

.searchBox{
  position:relative;
  max-width:620px;
  margin:25px auto 0;
}

.searchBox input{
  width:100%;
  height:51px;
  padding:0 50px 0 18px;
  border-radius:28px;
  border:1px solid var(--border);
  outline:0;
  background:var(--card);
  color:var(--text);
}

.searchBox input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(255,78,205,.08);
}

.searchIcon{
  position:absolute;
  right:18px;
  top:14px;
  color:var(--accent);
}

.library{
  width:90%;
  max-width:1300px;
  margin:auto;
  padding:15px 0 45px;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.sectionTitle{
  border-left:4px solid var(--accent);
  padding-left:12px;
  font-size:1.55rem;
}

.noteCount{
  color:var(--muted);
  font-size:.9rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

.card{
  min-height:225px;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(145deg,var(--card),var(--card2));
  box-shadow:var(--shadow);
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--accent);
}

.cardHead{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.cardIcon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:11px;
  color:var(--accent);
  background:rgba(255,78,205,.1);
}

.cardTitle{
  font-size:1.1rem;
  word-break:break-word;
}

.cardDesc{
  margin:14px 0;
  color:var(--muted);
  line-height:1.55;
  font-size:.9rem;
}

.cardDate{
  color:#7d87a4;
  font-size:.75rem;
  margin-bottom:12px;
}

.cardActions{
  display:flex;
  gap:8px;
}

.openBtn,.deleteBtn{
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card2);
  color:var(--accent);
  font-weight:700;
  padding:9px;
}

.openBtn{
  flex:1;
}

.deleteBtn{
  width:42px;
  color:var(--danger);
}

.openBtn:hover{
  background:var(--accent);
  color:white;
}

.deleteBtn:hover{
  background:var(--danger);
  color:white;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:55px 20px;
  border:1px dashed var(--border);
  border-radius:18px;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:var(--text);
  margin:10px 0 5px;
}

#editorSection{
  display:none;
  width:90%;
  max-width:1100px;
  margin:auto;
  padding:35px 0 55px;
}

.back{
  border:0;
  border-radius:9px;
  background:var(--card2);
  color:var(--accent);
  padding:9px 14px;
  font-weight:700;
  margin-bottom:22px;
}

.editorTitle{
  font-size:clamp(1.7rem,4vw,2.4rem);
  word-break:break-word;
}

.editorDesc{
  color:var(--muted);
  margin:7px 0 18px;
}

.notesBox{
  width:100%;
  min-height:390px;
  resize:vertical;
  padding:18px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:0;
  background:#050712;
  color:white;
  line-height:1.65;
}

.notesBox:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(255,78,205,.08);
}

.editorActions{
  display:flex;
  gap:9px;
  margin-top:14px;
}

.secondary{
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px 15px;
  background:var(--card2);
  color:var(--text);
  font-weight:700;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  padding:18px;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modalBox{
  width:min(460px,100%);
  padding:23px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.modalBox h2{
  color:var(--accent);
  margin-bottom:17px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:var(--muted);
  margin-bottom:6px;
  font-size:.86rem;
}

.field input,.field textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:0;
  background:var(--bg);
  color:var(--text);
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:2000;
  padding:11px 17px;
  border-radius:11px;
  background:white;
  color:#111827;
  font-weight:700;
  opacity:0;
  transform:translate(-50%,20px);
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.uiPanel{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:500;
  padding:10px;
  display:flex;
  gap:7px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(15,20,40,.9);
  backdrop-filter:blur(15px);
  box-shadow:var(--shadow);
}

.uiPanel button{
  border:1px solid var(--border);
  border-radius:9px;
  padding:7px 10px;
  background:var(--card2);
  color:var(--text);
  font-size:.78rem;
}

.uiPanel button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

footer{
  padding:25px;
  text-align:center;
  color:#77819d;
  border-top:1px solid var(--border);
}

body.ui2{
  --bg:#06151a;
  --bg2:#09262a;
  --card:#0d3031;
  --card2:#124345;
  --accent:#20e3b2;
  --accent2:#00a8ff;
  --border:rgba(32,227,178,.17);
}

body.ui2{
  background:
    radial-gradient(circle at 10% 0%,rgba(32,227,178,.16),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(0,168,255,.18),transparent 30%),
    linear-gradient(135deg,var(--bg),var(--bg2));
}

body.ui2 .logoIcon{
  border-radius:50%;
}

body.ui2 .card{
  border-radius:10px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}

body.ui2 .searchBox input{
  border-radius:10px;
}

body.ui2 .sectionTitle{
  border-left-color:var(--accent);
}

body.ui2 .hero h1 span{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
}

@media(max-width:700px){
  header{
    flex-wrap:wrap;
  }

  .actions{
    width:100%;
    justify-content:flex-end;
  }

  .ddg{
    width:165px;
  }

  .addBtn{
    padding:9px 11px;
    font-size:.82rem;
  }

  .library,#editorSection{
    width:92%;
  }
}

@media(max-width:430px){
  .logo span{
    display:none;
  }

  .ddg{
    width:145px;
  }

  .uiPanel{
    right:10px;
    bottom:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo" onclick="showHome()">
    <div class="logoIcon">✎</div>
    <span>Notes Keeper</span>
  </div>

  <div class="actions">

    <!-- Small DuckDuckGo search -->
    <form class="ddg" onsubmit="searchDuckDuckGo(event)">
      <input id="ddgInput" type="search" placeholder="DuckDuckGo...">
      <button type="submit">⌕</button>
    </form>

    <button class="addBtn" id="addNavBtn" onclick="openModal()">
      ＋ Add Note
    </button>

  </div>
</header>

<main id="mainDashboard">

<section class="hero">

  <h1>
    Welcome to <span>Notes Keeper</span>
  </h1>

  <p>
    Your personal notes and ideas collection hub.
  </p>

  <div class="searchBox">
    <input
      id="searchInput"
      type="search"
      oninput="searchNotes()"
      placeholder="Search your notes..."
    >
    <span class="searchIcon">⌕</span>
  </div>

</section>

<section class="library">

  <div class="sectionHead">
    <h2 class="sectionTitle">Your Notes</h2>
    <span class="noteCount" id="noteCount">0 notes</span>
  </div>

  <div class="grid" id="notesGrid"></div>

</section>

</main>

<section id="editorSection">

  <button class="back" onclick="showHome()">
    ← Back to Dashboard
  </button>

  <h1 class="editorTitle" id="activeNoteTitle">
    Note
  </h1>

  <p class="editorDesc" id="activeNoteDesc"></p>

  <textarea
    id="noteTextarea"
    class="notesBox"
    placeholder="Start typing your note here..."
  ></textarea>

  <div class="editorActions">

    <button class="primary" onclick="saveNoteContent()">
      💾 Save Note
    </button>

    <button class="secondary" onclick="deleteCurrentNote()">
      Delete Note
    </button>

  </div>

</section>

<!-- Add Note Modal -->
<div class="modal" id="addModal" onclick="closeModalBackdrop(event)">

  <div class="modalBox">

    <h2>Add New Note</h2>

    <div class="field">
      <label>Note Title / Topic</label>
      <input
        id="noteTitleInput"
        maxlength="120"
        placeholder="e.g. Project Ideas"
      >
    </div>

    <div class="field">
      <label>Short Description</label>
      <textarea
        id="noteDescInput"
        maxlength="500"
        placeholder="What is this note about?"
      ></textarea>
    </div>

    <div class="modalActions">

      <button class="secondary" onclick="closeModal()">
        Cancel
      </button>

      <button class="primary" onclick="addNote()">
        Save Note
      </button>

    </div>

  </div>

</div>

<!-- DOUBLE UI OPTION -->
<div class="uiPanel">

  <button id="ui1Btn" class="active" onclick="setUI(1)">
    UI 1
  </button>

  <button id="ui2Btn" onclick="setUI(2)">
    UI 2
  </button>

</div>

<div class="toast" id="toast"></div>

<footer>
  © 2026 Notes Keeper - Dynamic Notes Hub. All Rights Reserved.
</footer>

<script>

const STORAGE_KEY="notesKeeperDataV2";

let notesList=[];
let currentNoteIndex=null;
let toastTimer=null;

/* ---------------- STORAGE ---------------- */

function loadNotes(){

  try{

    const data=localStorage.getItem(STORAGE_KEY);

    notesList=data?JSON.parse(data):[];

    if(!Array.isArray(notesList)){
      notesList=[];
    }

  }catch(error){

    notesList=[];
    showToast("Could not load notes.");

  }

}

function saveStorage(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(notesList)
    );

    return true;

  }catch(error){

    showToast("Storage limit reached.");
    return false;

  }

}

/* ---------------- SECURITY ---------------- */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    char=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}

/* ---------------- DATE ---------------- */

function formatDate(date){

  if(!date)return "";

  const d=new Date(date);

  if(Number.isNaN(d.getTime()))return "";

  return d.toLocaleString([],{
    dateStyle:"medium",
    timeStyle:"short"
  });

}

/* ---------------- RENDER ---------------- */

function renderNotes(list=notesList){

  const grid=document.getElementById("notesGrid");

  grid.innerHTML="";

  document.getElementById("noteCount").textContent=
    `${list.length} note${list.length===1?"":"s"}`;

  if(list.length===0){

    grid.innerHTML=`

      <div class="empty">

        <div style="font-size:2rem">🗒️</div>

        <strong>No notes found</strong>

        <span>
          Click “＋ Add Note” to create your first note.
        </span>

      </div>

    `;

    return;

  }

  list.forEach(note=>{

    const index=notesList.indexOf(note);

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <div>

        <div class="cardHead">

          <div class="cardIcon">
            ✎
          </div>

          <h3 class="cardTitle">
            ${escapeHTML(note.title)}
          </h3>

        </div>

        <p class="cardDesc">
          ${escapeHTML(note.desc || "No description added.")}
        </p>

        <div class="cardDate">
          ${escapeHTML(formatDate(note.updatedAt || note.createdAt))}
        </div>

      </div>

      <div class="cardActions">

        <button
          class="openBtn"
          onclick="openNoteEditor(${index})"
        >
          Open Note
        </button>

        <button
          class="deleteBtn"
          onclick="deleteNote(${index})"
          title="Delete note"
        >
          ×
        </button>

      </div>

    `;

    grid.appendChild(card);

  });

}

/* ---------------- MODAL ---------------- */

function openModal(){

  document.getElementById("addModal").style.display="flex";

  setTimeout(()=>{
    document.getElementById("noteTitleInput").focus();
  },50);

}

function closeModal(){

  document.getElementById("addModal").style.display="none";

  document.getElementById("noteTitleInput").value="";
  document.getElementById("noteDescInput").value="";

}

function closeModalBackdrop(event){

  if(event.target.id==="addModal"){
    closeModal();
  }

}

/* ---------------- ADD NOTE ---------------- */

function addNote(){

  const title=
    document.getElementById("noteTitleInput")
    .value
    .trim();

  const desc=
    document.getElementById("noteDescInput")
    .value
    .trim();

  if(!title){

    showToast("Please enter a note title.");
    return;

  }

  const now=new Date().toISOString();

  notesList.push({

    id:
      window.crypto &&
      crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),

    title:title,
    desc:desc,
    content:"",
    createdAt:now,
    updatedAt:now

  });

  if(saveStorage()){

    closeModal();
    renderNotes();
    showToast("Note created successfully.");

  }

}

/* ---------------- EDITOR ---------------- */

function openNoteEditor(index){

  if(!notesList[index])return;

  currentNoteIndex=index;

  const note=notesList[index];

  document.getElementById("mainDashboard")
    .style.display="none";

  document.getElementById("addNavBtn")
    .style.display="none";

  document.getElementById("editorSection")
    .style.display="block";

  document.getElementById("activeNoteTitle")
    .textContent=note.title;

  document.getElementById("activeNoteDesc")
    .textContent=
      note.desc || "No description added.";

  document.getElementById("noteTextarea")
    .value=note.content || "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function saveNoteContent(){

  if(
    currentNoteIndex===null ||
    !notesList[currentNoteIndex]
  ){
    return;
  }

  notesList[currentNoteIndex].content=
    document.getElementById("noteTextarea").value;

  notesList[currentNoteIndex].updatedAt=
    new Date().toISOString();

  if(saveStorage()){

    showToast("Note saved successfully.");

  }

}

/* ---------------- DELETE ---------------- */

function deleteCurrentNote(){

  if(currentNoteIndex===null)return;

  deleteNote(currentNoteIndex,true);

}

function deleteNote(index,fromEditor=false){

  if(!notesList[index])return;

  const confirmed=
    confirm(
      `Delete "${notesList[index].title}"?`
    );

  if(!confirmed)return;

  notesList.splice(index,1);

  saveStorage();

  currentNoteIndex=null;

  if(fromEditor){

    showHome();

  }else{

    renderNotes();

  }

  showToast("Note deleted.");

}

/* ---------------- HOME ---------------- */

function showHome(){

  currentNoteIndex=null;

  document.getElementById("mainDashboard")
    .style.display="block";

  document.getElementById("addNavBtn")
    .style.display="block";

  document.getElementById("editorSection")
    .style.display="none";

  renderNotes();

}

/* ---------------- NOTE SEARCH ---------------- */

function searchNotes(){

  const query=
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  if(!query){

    renderNotes();
    return;

  }

  const results=
    notesList.filter(note=>

      String(note.title)
        .toLowerCase()
        .includes(query)

      ||

      String(note.desc || "")
        .toLowerCase()
        .includes(query)

      ||

      String(note.content || "")
        .toLowerCase()
        .includes(query)

    );

  renderNotes(results);

}

/* ---------------- DUCKDUCKGO ---------------- */

function searchDuckDuckGo(event){

  event.preventDefault();

  const query=
    document.getElementById("ddgInput")
    .value
    .trim();

  if(!query){

    document.getElementById("ddgInput").focus();
    return;

  }

  window.location.href=
    "https://duckduckgo.com/?q="+
    encodeURIComponent(query);

}

/* ---------------- UI SWITCHER ---------------- */

function setUI(number){

  const ui1=
    document.getElementById("ui1Btn");

  const ui2=
    document.getElementById("ui2Btn");

  if(number===2){

    document.body.classList.add("ui2");

    ui1.classList.remove("active");
    ui2.classList.add("active");

    localStorage.setItem("notesKeeperUI","2");

    showToast("UI 2 activated.");

  }else{

    document.body.classList.remove("ui2");

    ui2.classList.remove("active");
    ui1.classList.add("active");

    localStorage.setItem("notesKeeperUI","1");

    showToast("UI 1 activated.");

  }

}

/* ---------------- TOAST ---------------- */

function showToast(message){

  const toast=
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.classList.remove("show");

  },2200);

}

/* ---------------- KEYBOARD ---------------- */

document.addEventListener("keydown",event=>{

  if(event.key==="Escape"){

    const modal=
      document.getElementById("addModal");

    if(modal.style.display==="flex"){
      closeModal();
    }

  }

  if(
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase()==="k"
  ){

    event.preventDefault();

    document.getElementById("searchInput").focus();

  }

});

/* ---------------- START ---------------- */

window.addEventListener("load",()=>{

  loadNotes();

  renderNotes();

  const savedUI=
    localStorage.getItem("notesKeeperUI");

  setUI(savedUI==="2"?2:1);

});

</script>

</body>
</html>
